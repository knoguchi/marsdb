[workspace]
resolver = "2"
members = [
    "marsdb-storage",
    "marsdb-graph",
    "marsdb-query",
    "marsdb",
    "marsdb-cli",
    "marsdb-crash-harness",
    "marsdb-capi",
    "marsdb-nl2cypher",
    "marsdb-tck",
]
# marsdb-python builds as a PyO3 extension-module (no libpython link, no
# runnable test binary) via maturin, not plain `cargo build`/`cargo test` —
# kept out of the workspace so it doesn't affect `cargo test --workspace`.
# `cargo build`/`test` fail here at the *link* step regardless of whether
# the code is correct (extension-module deliberately skips linking
# libpython; maturin patches that in) -- but `cargo check --manifest-path
# marsdb-python/Cargo.toml` stops before linking and *does* catch real
# type errors (e.g. a PropertyValue match missing a new variant, which
# broke CI silently for a while since nothing local exercised this crate
# — see rust.yml's own `quality` job, which now runs this too). Run it
# yourself after any shared-type change (PropertyValue, Value, ...).
exclude = ["marsdb-python"]

[workspace.package]
version = "0.7.0"
edition = "2021"
# Verified via clippy's own `incompatible_msrv` lint (not guessed) --
# `Option::is_none_or` (stable since 1.82.0) is the newest stdlib item
# actually used anywhere in the workspace. Not tested against every
# toolchain above that; CI just runs whatever stable each GitHub-hosted
# runner ships.
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/knoguchi/marsdb"
homepage = "https://github.com/knoguchi/marsdb"
# The mdBook manual, not docs.rs -- crates.io falls back to docs.rs
# automatically when this field is unset, so this is deliberately the
# more useful link for someone evaluating the project (install/CLI/
# embedding guides, Cypher support table), not a duplicate of the
# auto-generated rustdoc.
documentation = "https://knoguchi.github.io/marsdb/"
readme = "README.md"
keywords = ["graph-database", "cypher", "opencypher", "embedded", "database"]
categories = ["database-implementations", "data-structures"]

[workspace.dependencies]
redb = "4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustyline = "18"
criterion = "0.8"
tempfile = "3"
# Calendar math (leap years, month lengths) plus the system clock (`date()`
# with no arguments) -- `iana-time-zone`/`js-sys`/`winapi` etc are off via
# `default-features = false`; named-timezone resolution (DateTime's
# `TzId::Named`) goes through `chrono-tz` below instead, which embeds its
# own copy of the IANA database rather than reading the host OS's.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
