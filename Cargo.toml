[workspace]
resolver = "2"
members = [
    "marsdb-storage",
    "marsdb-graph",
    "marsdb-query",
    "marsdb",
    "marsdb-cli",
    "marsdb-crash-harness",
    "marsdb-capi",
    "marsdb-nl2cypher",
    "marsdb-tck",
]
# marsdb-python builds as a PyO3 extension-module (no libpython link, no
# runnable test binary) via maturin, not plain `cargo build`/`cargo test` —
# kept out of the workspace so it doesn't affect `cargo test --workspace`.
exclude = ["marsdb-python"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/knoguchi/marsdb"
homepage = "https://github.com/knoguchi/marsdb"
readme = "README.md"

[workspace.dependencies]
redb = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "14"
criterion = "0.5"
tempfile = "3"
# Calendar math (leap years, month lengths) plus the system clock (`date()`
# with no arguments) -- `iana-time-zone`/`js-sys`/`winapi` etc are off via
# `default-features = false`; named-timezone resolution (DateTime's
# `TzId::Named`) goes through `chrono-tz` below instead, which embeds its
# own copy of the IANA database rather than reading the host OS's.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
