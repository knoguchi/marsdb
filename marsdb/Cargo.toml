[package]
name = "marsdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Embeddable property-graph database with an openCypher query subset: single binary, single file, optional in-memory mode."

[lib]
name = "marsdb"
path = "src/lib.rs"

[dependencies]
marsdb-storage = { path = "../marsdb-storage", version = "0.4.0" }
marsdb-graph = { path = "../marsdb-graph", version = "0.4.0" }
marsdb-query = { path = "../marsdb-query", version = "0.4.0" }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
criterion.workspace = true
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "histogram"] }

[[bench]]
name = "cypher_ops"
harness = false

[[bench]]
name = "ldbc_ops"
harness = false

[[bench]]
name = "aggregate_ops"
harness = false

[[bench]]
name = "concurrency_ops"
harness = false
