[package]
name = "marsdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embeddable property-graph database with an openCypher query subset: single binary, single file, optional in-memory mode."

[lib]
name = "marsdb"
path = "src/lib.rs"

[dependencies]
marsdb-storage = { path = "../marsdb-storage", version = "0.9.0" }
marsdb-graph = { path = "../marsdb-graph", version = "0.9.0" }
marsdb-query = { path = "../marsdb-query", version = "0.9.0" }
thiserror.workspace = true
# `arrow` feature only -- heavyweight, off by default. The feature is
# exempt from the workspace MSRV (arrow-rs tracks recent stable).
arrow-array = { version = "59", optional = true, features = ["ffi"] }
arrow-schema = { version = "59", optional = true }
arrow-buffer = { version = "59", optional = true }

[features]
# Arrow result export: Database::query_arrow + RecordBatchReader/FFI
# stream support. Off by default to keep the core dependency-light.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer"]

[dev-dependencies]
tempfile = "3"
criterion.workspace = true
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "histogram"] }
postcard.workspace = true
serde.workspace = true

[[bench]]
name = "cypher_ops"
harness = false

[[bench]]
name = "ldbc_ops"
harness = false

[[bench]]
name = "aggregate_ops"
harness = false

[[bench]]
name = "concurrency_ops"
harness = false

[[bench]]
name = "index_ops"
harness = false
