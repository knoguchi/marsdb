[package]
name = "marsdb-python"
version = "0.7.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/knoguchi/marsdb"
homepage = "https://github.com/knoguchi/marsdb"
description = "Python bindings for MarsDB, an embeddable property-graph database."

[lib]
name = "marsdb"
crate-type = ["cdylib"]

[dependencies]
marsdb = { path = "../marsdb" }
marsdb-graph = { path = "../marsdb-graph" }
pyo3 = { version = "0.29", features = ["extension-module"] }
