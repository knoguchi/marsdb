[package]
name = "marsdb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for MarsDB, an embeddable property-graph database: single binary, single file."

[[bin]]
name = "mars"
path = "src/main.rs"

[dependencies]
marsdb = { path = "../marsdb", version = "0.8.0" }
marsdb-graph = { path = "../marsdb-graph", version = "0.8.0" }
marsdb-nl2cypher = { path = "../marsdb-nl2cypher", version = "0.8.0" }
clap.workspace = true
rustyline.workspace = true
ureq = { version = "3", features = ["json"] }
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
