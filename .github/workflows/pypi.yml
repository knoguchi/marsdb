name: PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  macos-wheels:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: marsdb-python
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: marsdb-python/dist

  linux-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: marsdb-python
          command: build
          args: --release --out dist
          target: x86_64-unknown-linux-gnu
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: marsdb-python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: marsdb-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: marsdb-python/dist

  publish:
    needs: [macos-wheels, linux-wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
