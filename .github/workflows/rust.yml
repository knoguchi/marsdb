name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # marsdb-python is workspace-excluded (see Cargo.toml's own comment
      # on `exclude` -- it only fully builds/links via maturin), so
      # nothing above touches it. `cargo check` stops before linking and
      # still catches real type errors (e.g. a shared PropertyValue/Value
      # match missing a new variant) that silently broke CI here before.
      - name: Check marsdb-python compiles (type-check only, no link)
        run: cargo check --manifest-path marsdb-python/Cargo.toml

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build workspace
        run: cargo build --workspace --verbose
      - name: Run workspace tests
        run: cargo test --workspace --verbose

  coverage:
    name: Coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # `--exclude marsdb-tck`: its own conformance-run binary is exercised
      # via `cargo run -p marsdb-tck --release` against the vendored TCK
      # submodule (see CYPHER_COVERAGE.md), not `cargo test` -- counting it
      # here would show 0% on real, tested code and skew the number down
      # for no reason. `--ignore-filename-regex 'generated/'`: vendored
      # ANTLR output (`marsdb-query/src/generated/`), not hand-written
      # logic -- same reasoning.
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --exclude marsdb-tck \
            --ignore-filename-regex 'generated/' \
            --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  bindings:
    name: Python and Go bindings
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v5
        with:
          go-version-file: marsdb-go/go.mod
          # marsdb-go has zero external dependencies (stdlib + cgo only) --
          # no go.sum ever exists to key module caching against, which
          # otherwise prints a harmless but noisy "Restore cache failed"
          # warning on every run.
          cache: false
      - name: Build Rust workspace
        run: cargo build --workspace --verbose
      - name: Build and test Python binding
        working-directory: marsdb-python
        run: |
          python -m pip install maturin
          maturin build --out dist
          python -m pip install --force-reinstall dist/*.whl
          python -m unittest discover -s tests
      - name: Run Go binding tests
        working-directory: marsdb-go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: go test ./...

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}