name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Clippy (arrow feature)
        run: cargo clippy -p marsdb -p marsdb-capi --all-targets --features arrow -- -D warnings
      # marsdb-python is workspace-excluded (see Cargo.toml's own comment
      # on `exclude` -- it only fully builds/links via maturin), so
      # nothing above touches it. `cargo check` stops before linking and
      # still catches real type errors (e.g. a shared PropertyValue/Value
      # match missing a new variant) that silently broke CI here before.
      - name: Check marsdb-python compiles (type-check only, no link)
        run: cargo check --manifest-path marsdb-python/Cargo.toml

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build workspace
        run: cargo build --workspace --verbose
      - name: Run workspace tests
        run: cargo test --workspace --verbose
      # The Arrow export is feature-gated off by default (arrow-rs is
      # heavy); exercise it explicitly on the crates that carry it.
      - name: Run Arrow feature tests
        run: cargo test -p marsdb -p marsdb-capi --features arrow --verbose

  coverage:
    name: Coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # `--exclude marsdb-tck`: its own conformance-run binary is exercised
      # via `cargo run -p marsdb-tck --release` against the vendored TCK
      # submodule (see CYPHER_COVERAGE.md), not `cargo test` -- counting it
      # here would show 0% on real, tested code and skew the number down
      # for no reason. `--ignore-filename-regex 'generated/'`: vendored
      # ANTLR output (`marsdb-query/src/generated/`), not hand-written
      # logic -- same reasoning.
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --exclude marsdb-tck \
            --ignore-filename-regex 'generated/' \
            --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  bindings:
    name: Python binding
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build Rust workspace
        run: cargo build --workspace --verbose
      # The Go bindings live in https://github.com/knoguchi/marsdb-go and
      # link against this crate's C ABI (arrow feature included). Keep the
      # feature compiling here so a PR can't silently break that repo's CI,
      # which builds marsdb-capi from this repo's main.
      - name: Build marsdb-capi with Arrow
        run: cargo build -p marsdb-capi --features arrow --verbose
      - name: Build and test Python binding
        working-directory: marsdb-python
        run: |
          # pyarrow is a dev-only dependency: the Arrow tests exercise
          # the PyCapsule protocol through a real consumer.
          python -m pip install maturin pyarrow
          maturin build --out dist
          python -m pip install --force-reinstall dist/*.whl
          python -m unittest discover -s tests

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}