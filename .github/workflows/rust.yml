name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build workspace
        run: cargo build --workspace --verbose
      - name: Run workspace tests
        run: cargo test --workspace --verbose

  bindings:
    name: Python and Go bindings
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v5
        with:
          go-version-file: marsdb-go/go.mod
          # marsdb-go has zero external dependencies (stdlib + cgo only) --
          # no go.sum ever exists to key module caching against, which
          # otherwise prints a harmless but noisy "Restore cache failed"
          # warning on every run.
          cache: false
      - name: Build Rust workspace
        run: cargo build --workspace --verbose
      - name: Build and test Python binding
        working-directory: marsdb-python
        run: |
          python -m pip install maturin
          maturin build --out dist
          python -m pip install --force-reinstall dist/*.whl
          python -m unittest discover -s tests
      - name: Run Go binding tests
        working-directory: marsdb-go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: go test ./...

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}