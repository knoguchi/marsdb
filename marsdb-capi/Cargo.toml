[package]
name = "marsdb-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "C ABI for MarsDB, an embeddable property-graph database — the basis for non-Rust language bindings (e.g. marsdb-go)."

[lib]
name = "marsdb_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
marsdb = { path = "../marsdb" }
# Request-side only: parsing the params JSON object in
# marsdb_execute_with_params. Results stay hand-built (see lib.rs docs).
serde_json = "1"
