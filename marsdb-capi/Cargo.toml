[package]
name = "marsdb-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "C ABI for MarsDB, an embeddable property-graph database — the basis for non-Rust language bindings (e.g. marsdb-go)."

[lib]
name = "marsdb_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
marsdb = { path = "../marsdb" }
marsdb-graph = { path = "../marsdb-graph" }

[features]
# Arrow C Data Interface exports (marsdb_query_arrow /
# marsdb_stmt_execute_arrow). Off by default: pulls arrow-rs into the
# static/shared library.
arrow = ["marsdb/arrow"]
